<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Facilities</title>
    <style>
        /* General styles */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        /* Title styling */
        h2 {
            font-size: 28px;
            color: #333;
            margin-top: 20px;
        }

        /* Facility container: arranges images in rows */
        .facility-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        /* Facility box styling */
        .facility {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 300px;
            transition: transform 0.3s;
        }

        /* Hover effect */
        .facility:hover {
            transform: scale(1.05);
        }

        /* Image styling */
        .facility img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            border: 3px solid #3498db; /* Blue border */
        }

        /* Label Styling */
        .label {
            margin-top: 10px;
            font-weight: bold;
            color: #333;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h2>School Facilities</h2>

    <div class="facility-container">
        <div class="facility">
            <img src="C:\Users\My PC\OneDrive\Desktop\peksur\pagcor.jpg" alt="PAGCOR Building">
            <div class="label">PAGCOR Building</div>
        </div>

        <div class="facility">
            <img src="C:\Users\My PC\OneDrive\Desktop\peksur\new.jpg" alt="New Building">
            <div class="label">New Building</div>
        </div> 

        <div class="facility">

            <div class="label">Esperon Building</div>
        </div>
    </div>

    <div class="facility-container">

            <img src="C:\Users\My PC\OneDrive\Desktop\peksur\cayetano.jpg" alt="Cayetano Building">
            <div class="label">Cayetano Building</div>
        </div>

        <div class="facility">
