<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty and Staff</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        h2 {
            padding: 20px;
            font-size: 36px;
            color: #333;
        }

        .container {
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .profile img {
            width: 250px; /* Increased size */
            height: 250px; /* Increased size */
            border-radius: 5px; /* Reduced corner radius */
            object-fit: cover;
            border: 4px solid #555; /* Darker border */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); /* Subtle shadow */
            transition: transform 0.3s ease, box-shadow 0.3s ease; /* Smooth hover effect */
            cursor: pointer;
        }

        .profile img:hover {
            transform: scale(1.1); /* Enlarge on hover */
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3); /* Larger shadow on hover */
        }

        /* Style for the modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            overflow: auto;
            padding-top: 60px;
        }

        .modal-content {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 800px; /* Increased max-width for larger image */
            border: 5px solid white;
            border-radius: 5px; /* Sharper corners for modal */
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Faculty and Staff</h2>
    
    <div class="container">
        <div class="profile">
            <img src="C:/Users/My PC/OneDrive/Desktop/hays/stap.jpg" alt="Faculty 1" onclick="openModal(this.src)">
        </div>
    </div>

    <!-- Modal for image view -->
    <div id="myModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <script>
        // Function to open the modal with the clicked image
        function openModal(src) {
            var modal = document.getElementById("myModal");
            var modalImg = document.getElementById("modalImg");
            modal.style.display = "block";
            modalImg.src = src;
        }

        // Function to close the modal
        function closeModal() {
            var modal = document.getElementById("myModal");
            modal.style.display = "none";
        }
    </script>

</body>
</html>
