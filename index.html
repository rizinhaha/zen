
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rosales National High School - Sign Up</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: url('eng.jpg') no-repeat center center/cover;
      color: #fff;
    }
    .header {
      background-color: rgba(31, 45, 61, 0.8);
      color: white;
      padding: 10px 20px;
      text-align: center;
    }
    .container {
      margin: 100px auto;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.8);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      text-align: center;
      color: #333;
    }
    h2 {
      color: #333;
    }
    input {
      width: 90%;
      margin: 10px auto;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Rosales National High School</h1>
  </div>
  <div class="container">
    <h2>Log In</h2>
    <form action="main.html" method="get">
      <input type="text" name="email" placeholder="Enter your email" required>
      <input type="password" name="password" placeholder="Enter your password" required>
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
